<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript" src="./jquery-3.7.1.min.js"></script>
    <script type="text/javascript" src="./js/02-eventos.js"></script>

    <!-- Estilos -->
    <style>
        #caja{
            width: 250px;
            height: 250px;
            border: 2px solid black;
            background: yellow;
            transition: 300ms all;
        }

        input{
            padding: 10px;
            width: 300px;
            font-size: 20px;
        }

        #datos{
            border: 4px dashed black;
            padding: 10px;
            width: 250px;
            height: 50px;
            margin-top: 20px;
            display: none;
        }

        /* Construir un redondel */
        #sigueme{
            height: 25px;
            width: 25px;
            position: absolute;
            display: block;
            background: yellow;
            opacity: 0.5;
            border: 3px solid black;
            border-radius: 999px;
        }
    </style>
    <!-- Fin Estilos -->
</head>
<body>
    <h1>Aprendiendo Jquery - Eventos</h1>

    <div id="sigueme">

    </div>

    <form>
        <input type="text" id="nombre">
    </form>

    <div id="datos">

    </div>
    <br>
    <div id="caja">
        Soy una caja
    </div>
</body>
</html>
