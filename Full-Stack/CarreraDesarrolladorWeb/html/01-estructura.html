<!DOCTYPE html><!--Informa al navegador que version HTMLse usó para escribir el documento Doctype es una declaración no una etiqueta HTML-->
<html lang="en"><!--<html> indica que es un documento html, lang es utilizado para indicar el idioma del documento-->
<head><!--head va lo que es la cabecera del documento no puede ver el usuario, los metadatos se colocan aqui y son para posicionar la busqueda osea para que el buscador pueda encontrar el documento-->
    <meta charset="UTF-8"><!--Este elemento simplemente especifica la codificación de caracteres del documento-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Proporciona al navegador instrucciones sobre cómo controlar las dimensiones de la ventana del navegador y la relación de escala de la página. Añandir el código width=device-width asegurará que la pagina se adapte a la pantalla del usuario-->
    <title>Document</title>
    <link rel="stylesheet" type="text/css" href=""><!--link Permite a los autores vincular su documento a tros recursos, rel atributo que define el tipo de contenido al que se enlaza type="text/css" para indicar que tipo de contenido voy a mostrar href="estilos.css" especifico la ruta del archivo css-->
</head>
<body><!--va el cuerpo del documento-->
    Hola mundo
</body>
</html>
