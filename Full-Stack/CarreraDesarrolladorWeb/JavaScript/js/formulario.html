<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio DOM y Funciones</title>
    <script type="text/javascript" src="./29-Ejercicio_Dom.js"></script>

    <!--Estilos-->
    <style>
        .box{
            width: 200px;
            height: 250px;
            float: left;
            margin: 20px
        }

        .dashed{
            border: 3px dashed black;
            padding: 5px;
        }
    </style>
</head>
<body>
    <!--  
    1. Fomrulario Campos: Nombres, Apellidos, Edad
    2. Boton enviar el formulario: eventos submit
    3. Mostrar los datos en pantalla
    4. Tener un boton que al darle click nos muestra los datos acutales del formulario
    -->
    <h1> Ejercicio Dom eventos y Funciones</h1>
    <div class="box">
        <form action="#", method="post", id="formulario" onsubmit="return false">
            <label for="nombre">Nombre</label> 
                <br>
                <input type="text" name="nombre" id="nombre">
                <br>
                <span id="error_nombre"></span>
                <br>
            <label for="apellidos">Apellidos</label>
                <br>
                <input type="text" name="apellidos" id="apellidos">
                <br>
                <br>
            <label for="edad">Edad</label>
                <br>
                <input type="text" name="edad" id="edad">    
                <br>
                <br>
                <input type="submit" value="Enviar" id="submit">
        </form>
    </div>
    <div class="box dashed">
        <h3>Información Usuario</h3>
        <hr>
        <p id="p_nombre">
            Nombre: <span></span>
        </p>
        <p id="p_apellidos">
            Apellidos: <span></span>
        </p>
        <p id="p_edad">
            Edad: <span></span>
        </p>
    </div>
</body>
</html>
